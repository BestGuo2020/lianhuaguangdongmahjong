<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#d2aa58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- 门洞（门打开后露出的门口） -->
  <rect x="3" y="4" width="18" height="16" rx="1"/>
  <!-- 门扇：从左侧铰链向外打开（透视梯形） -->
  <path d="M3 4 L11 6.8 L11 17.2 L3 20 Z" fill="#d2aa58" fill-opacity="0.16"/>
  <!-- 门把手 -->
  <circle cx="9.5" cy="12" r="1.1" fill="#d2aa58" stroke="none"/>
</svg>
