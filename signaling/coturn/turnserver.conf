# coturn TURN/STUN 服务器配置（配合 signaling/server.py 做 NAT 穿透兜底）
# 把下面的 realm / user / external-ip 改成你自己的值后放到云服务器上运行。

# 监听端口：3478 = STUN/TURN(udp+tcp)，5349 = TURN over TLS
listening-port=3478
tls-listening-port=5349

# 认证：长期凭证（lt-cred-mech），静态账号 user:password
fingerprint
lt-cred-mech
realm=your.domain.example.com
user=turn:CHANGE_ME_STRONG_PASSWORD

# 中继分配的 UDP 端口范围（云服务器安全组需放行 49152-65535/udp）
min-port=49152
max-port=65535

# 云服务器公网 IP（多网卡/NAT 时必须显式指定，否则 ICE 候选会带内网 IP 导致连不上）
# external-ip=你的云服务器公网IP

log-file=stdout
